name: Backend CI

on:
  push:
    branches: [dev, main]
    paths:
      - "backend/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pigeon_pool
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pigeon_pool"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_PASSWORD: postgres
      JWT_SECRET: backend-ci-only-secret
      EMAIL_ACCESS_KEY: backend-ci-only-email-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Ruff
        run: python -m ruff check backend tests

      - name: Pyright
        run: python -m pyright backend tests

      - name: Test Alembic base-to-head database and backend suite
        run: python tests/run_alembic_database_suite.py

  playwright-debian-11:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bullseye

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install the repository's Playwright requirement
        run: |
          requirement="$(python -c "from pathlib import Path; print(next(line.split('#', 1)[0].strip() for line in Path('backend/requirements.txt').read_text(encoding='utf-8').splitlines() if line.split('#', 1)[0].strip().startswith('playwright')))")"
          test "$requirement" = "playwright==1.61.0"
          python -m pip install "$requirement"

      - name: Install and launch Chromium on Debian 11
        run: |
          python -m playwright install --with-deps chromium
          python -c "from playwright.sync_api import sync_playwright; pw = sync_playwright().start(); browser = pw.chromium.launch(args=['--no-sandbox']); print(f'Chromium launch succeeded: {browser.version}'); browser.close(); pw.stop()"
