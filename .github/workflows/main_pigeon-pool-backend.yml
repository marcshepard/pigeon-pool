
name: Build and deploy Python app to Azure Web App – pigeon-pool-backend

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - '.github/workflows/main_pigeon-pool-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-graph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Require the Debian 11 compatible Playwright pin
        run: >-
          python -c "from pathlib import Path; requirement = next(line.split('#', 1)[0].strip() for line in Path('backend/requirements.txt').read_text(encoding='utf-8').splitlines() if line.split('#', 1)[0].strip().startswith('playwright')); assert requirement == 'playwright==1.61.0', f'Azure Debian 11 requires playwright==1.61.0, found {requirement}'"

      - name: Require exactly one Alembic head
        run: |
          python -m pip install "alembic>=1.19,<2.0"
          python -c "from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config('backend/alembic.ini')).get_heads(); assert len(heads) == 1, f'Expected exactly one Alembic head, found: {heads}'"

  build-and-deploy:
    needs: migration-graph
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      ZIP_NAME: release.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create root requirements.txt
        run: echo "-r backend/requirements.txt" > requirements.txt

      - name: Zip artifact from repo root
        run: |
          chmod +x backend/startup.sh
          zip -r ${{ env.ZIP_NAME }} backend requirements.txt \
            -x "backend/venv/**" "backend/.venv/**" "backend/__pycache__/**" "*.pyc" \
               "backend/.git/**" "backend/.github/**" "backend/.pytest_cache/**" "backend/tests/**" \
               "backend/.env.local" "backend/.env.*.local"

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'pigeon-pool-backend'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_9434C8B104FA42D698A263DF9534D244 }}
          package: ${{ env.ZIP_NAME }}

      - name: Require the migrated backend to become healthy
        env:
          HEALTH_BASE_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
          HEALTH_URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}/ping
        run: |
          test -n "$HEALTH_BASE_URL"
          curl --fail --silent --show-error \
            --retry 30 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 15 \
            "$HEALTH_URL"
